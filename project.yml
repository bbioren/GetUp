name: GetUp
options:
  bundleIdPrefix: com.bbioren
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: QBJ4JULSZU
    CODE_SIGN_STYLE: Automatic
targets:
  # iPhone companion: installing this on the phone pushes the watch app to the watch.
  GetUp:
    type: application
    platform: iOS
    sources: [iOS]
    dependencies:
      - target: GetUpWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: GetUp
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bbioren.GetUp

  GetUpWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    entitlements:
      path: Watch/GetUp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: GetUp
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.bbioren.GetUp
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes: [alarm, workout-processing]
        NSMotionUsageDescription: GetUp counts your steps and jumping jacks to turn off the alarm.
        NSHealthShareUsageDescription: GetUp reads your heart rate to check that you're actually up.
        NSHealthUpdateUsageDescription: GetUp runs a short workout session to read live heart rate. It is never saved.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bbioren.GetUp.watchkitapp
        PRODUCT_NAME: GetUp
