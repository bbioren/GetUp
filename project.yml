name: GetUp
options:
  bundleIdPrefix: com.bbioren
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GetUp:
    type: application
    platform: watchOS
    sources: [GetUp]
    entitlements:
      path: GetUp/GetUp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: GetUp/Info.plist
      properties:
        CFBundleDisplayName: GetUp
        WKApplication: true
        WKWatchOnly: true
        WKBackgroundModes: [alarm, workout-processing]
        NSMotionUsageDescription: GetUp counts your steps and jumping jacks to turn off the alarm.
        NSHealthShareUsageDescription: GetUp reads your heart rate to check that you're actually up.
        NSHealthUpdateUsageDescription: GetUp runs a short workout session to read live heart rate. It is never saved.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bbioren.GetUp
        CODE_SIGN_STYLE: Automatic
